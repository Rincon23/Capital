# Quem pode conectar no Postgres do Capital. Vale a primeira linha que casar; o resto é recusado.
#
# O acesso de fora do Pi é controlado por ONDE a porta é publicada (docker-compose.yml:
# 127.0.0.1 no Pi e, com o perfil "dev", só o IP da Tailscale). Conexões que chegam pela porta
# publicada aparecem aqui com o IP do gateway da rede Docker, então este arquivo não consegue
# filtrar por origem. Além disso, cada usuário só tem CONNECT no próprio banco (initdb/).
#
# TYPE  DATABASE  USER  ADDRESS        METHOD

# Dentro do próprio container (docker exec … psql, scripts de inicialização).
local   all       all                  trust

# A rede Docker `capital-db` (app, worker, backup e as portas publicadas) e o loopback.
host    all       all   samenet        scram-sha-256
host    all       all   127.0.0.1/32   scram-sha-256
host    all       all   ::1/128        scram-sha-256
